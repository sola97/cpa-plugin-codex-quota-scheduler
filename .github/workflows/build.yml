name: Build

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  PLUGIN_NAME: codex-quota-scheduler

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: make test

      - name: Vet
        run: make vet

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
          - goos: darwin
            goarch: arm64
            runner: macos-15
          - goos: windows
            goarch: amd64
            runner: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up MinGW
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            make

      - name: Resolve release metadata
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "ARCHIVE_NAME=${PLUGIN_NAME}_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip" >> "${GITHUB_ENV}"

      - name: Build and package plugin
        run: make package VERSION="${VERSION}" GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            dist/${{ env.ARCHIVE_NAME }}
            dist/${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error

          retention-days: 7
  build-windows-arm64:
    name: Build windows/arm64
    needs: test
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve release metadata
        id: release_metadata
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "ARCHIVE_NAME=${PLUGIN_NAME}_${VERSION}_windows_arm64.zip" >> "${GITHUB_ENV}"

      - name: Build Windows ARM64 shared library
        timeout-minutes: 45
        uses: go-cross/cgo-actions@v1
        env:
          GOFLAGS: -trimpath -buildmode=c-shared
        with:
          dir: .
          packages: .
          targets: windows-arm64
          out-dir: dist/windows-arm64
          output: ${{ env.PLUGIN_NAME }}.dll
          flags: -ldflags=-s -w
          x-flags: main.pluginVersion=${{ steps.release_metadata.outputs.version }}

      - name: Package plugin
        run: |
          set -euo pipefail
          rm -f go-cross-bin.h "dist/windows-arm64/${PLUGIN_NAME}.h"
          go run ./.github/scripts/package-release.go \
            -library "dist/windows-arm64/${PLUGIN_NAME}.dll" \
            -archive "dist/${ARCHIVE_NAME}" \
            -checksum "dist/${ARCHIVE_NAME}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            dist/${{ env.ARCHIVE_NAME }}
            dist/${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error

          retention-days: 7
  build-freebsd:
    name: Build freebsd/amd64
    needs: test
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve release metadata
        id: release_metadata
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "ARCHIVE_NAME=${PLUGIN_NAME}_${VERSION}_freebsd_amd64.zip" >> "${GITHUB_ENV}"

      - name: Build FreeBSD shared library
        timeout-minutes: 45
        env:
          GOFLAGS: -trimpath -buildmode=c-shared
        run: |
          set -euo pipefail
          # go-cross/cgo-actions hardcodes 14.3-RELEASE, which FreeBSD removed
          # from its distribution servers. Replicate the action's freebsd
          # engine (base.txz sysroot + clang cross build) against a release
          # that is still downloadable. Bump FREEBSD_RELEASE when it is
          # superseded and dropped from download.freebsd.org.
          FREEBSD_RELEASE="14.5-RELEASE"
          FREEBSD_TRIPLE="x86_64-unknown-freebsd14.5"
          wget -q "https://download.freebsd.org/releases/amd64/${FREEBSD_RELEASE}/base.txz"
          mkdir -p ./freebsd-sysroot dist/freebsd-amd64
          sudo tar -xf ./base.txz -C ./freebsd-sysroot
          rm -f ./base.txz
          CGO_ENABLED=1 GOOS=freebsd GOARCH=amd64 \
          CGO_LDFLAGS="-fuse-ld=lld" \
          CC="clang --target=${FREEBSD_TRIPLE} --sysroot=$(pwd)/freebsd-sysroot" \
            go build -o "dist/freebsd-amd64/${PLUGIN_NAME}.so" \
            -ldflags="-s -w -X main.pluginVersion=${VERSION}" .

      - name: Package plugin
        run: |
          set -euo pipefail
          rm -f go-cross-bin.h "dist/freebsd-amd64/${PLUGIN_NAME}.h"
          go run ./.github/scripts/package-release.go \
            -library "dist/freebsd-amd64/${PLUGIN_NAME}.so" \
            -archive "dist/${ARCHIVE_NAME}" \
            -checksum "dist/${ARCHIVE_NAME}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            dist/${{ env.ARCHIVE_NAME }}
            dist/${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error

          retention-days: 7
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
      - build-windows-arm64
      - build-freebsd
    runs-on: ubuntu-24.04
    steps:
      - name: Restore consolidated artifacts on job rerun
        id: restore_retained_artifacts
        if: ${{ github.run_attempt > 1 }}
        uses: actions/github-script@v9
        with:
          script: |
            const path = require('node:path');
            const os = require('node:os');
            async function restoreRetainedArtifacts({
              github,
              context,
              core,
              exec,
              owner = context.repo.owner,
              repo = context.repo.repo,
              desiredName = '',
              pattern = '',
              targetPath,
              mergeMultiple = false,
              explicitName = false,
              tempRoot = process.env.RUNNER_TEMP || os.tmpdir(),
              fs = require('node:fs'),
            }) {
              if (context.runAttempt <= 1) {
                core.setOutput('restored', 'false');
                return false;
              }
            
              const runArtifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner,
                repo,
                run_id: context.runId,
                per_page: 100,
              });
              const matches = (name) => {
                if (desiredName) return name === desiredName;
                if (pattern) {
                  const escaped = pattern.replace(/[.+^${}()|[\]\\]/g, '\\$&');
                  const expression = new RegExp(`^${escaped.replace(/\*/g, '.*').replace(/\?/g, '.')}$`);
                  return expression.test(name);
                }
                return true;
              };
              if (runArtifacts.some((artifact) => !artifact.expired && matches(artifact.name))) {
                core.info('Matching current-run artifacts are available; keeping the normal download step.');
                core.setOutput('restored', 'false');
                return false;
              }
            
              const repositoryName = `${owner}/${repo}`;
              const repositoryArtifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
                owner,
                repo,
                per_page: 100,
              });
              const candidates = [];
              for (const artifact of repositoryArtifacts) {
                const match = /^latest-run-(\d+)-(\d+)-(\d+)$/.exec(artifact.name);
                if (!match || Number(match[1]) !== Number(context.runId) || artifact.expired || !artifact.workflow_run?.id) continue;
                const retentionRun = (await github.rest.actions.getWorkflowRun({
                  owner,
                  repo,
                  run_id: artifact.workflow_run.id,
                })).data;
                if (retentionRun.status !== 'completed' ||
                    retentionRun.path !== '.github/workflows/artifact-retention.yml' ||
                    retentionRun.repository?.full_name !== repositoryName) continue;
                candidates.push({ artifact, sourceCreatedAt: Number(match[2]), sourceAttempt: Number(match[3]) });
              }
              candidates.sort((left, right) =>
                right.sourceCreatedAt - left.sourceCreatedAt ||
                right.sourceAttempt - left.sourceAttempt ||
                Date.parse(right.artifact.created_at) - Date.parse(left.artifact.created_at)
              );
              if (candidates.length === 0) {
                throw new Error(`No retained artifact bundle from .github/workflows/artifact-retention.yml matches source run ${context.runId}.`);
              }
            
              const bundle = candidates[0].artifact;
              const outerZip = path.join(tempRoot, `retained-${context.runId}.zip`);
              const outerDir = path.join(tempRoot, `retained-${context.runId}`);
              fs.mkdirSync(outerDir, { recursive: true });
              const archive = await github.rest.actions.downloadArtifact({
                owner,
                repo,
                artifact_id: bundle.id,
                archive_format: 'zip',
              });
              fs.writeFileSync(outerZip, Buffer.from(archive.data));
              await exec.exec('unzip', ['-q', '-o', outerZip, '-d', outerDir]);
            
              const manifestPath = path.join(outerDir, 'manifest.json');
              if (!fs.existsSync(manifestPath)) throw new Error(`Retained bundle ${bundle.name} has no manifest.json.`);
              const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
              if (Number(manifest.sourceRunId) !== Number(context.runId) || !Array.isArray(manifest.artifacts)) {
                throw new Error(`Retained bundle ${bundle.name} does not describe source run ${context.runId}.`);
              }
              const selected = manifest.artifacts.filter((item) => item && typeof item.name === 'string' && matches(item.name));
              if (selected.length === 0) {
                throw new Error(`Retained bundle ${bundle.name} contains no artifact matching ${desiredName || pattern || '*'} for run ${context.runId}.`);
              }
            
              const destination = path.resolve(targetPath);
              fs.mkdirSync(destination, { recursive: true });
              for (const item of selected) {
                if (typeof item.filename !== 'string' || path.basename(item.filename) !== item.filename || !item.filename.endsWith('.zip')) {
                  throw new Error(`Retained bundle ${bundle.name} contains an invalid archive filename.`);
                }
                const innerZip = path.join(outerDir, item.filename);
                if (!fs.existsSync(innerZip)) throw new Error(`Retained bundle ${bundle.name} is missing ${item.filename}.`);
                const artifactPath = mergeMultiple || explicitName ? destination : path.join(destination, item.name);
                fs.mkdirSync(artifactPath, { recursive: true });
                await exec.exec('unzip', ['-q', '-o', innerZip, '-d', artifactPath]);
                core.info(`Restored artifact ${item.name} to ${artifactPath}`);
              }
            
              core.setOutput('restored', 'true');
              return true;
            }
            await restoreRetainedArtifacts({ github, context, core, exec, ...{"targetPath":"dist","mergeMultiple":true} });
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        if: ${{ steps.restore_retained_artifacts.outputs.restored != 'true' }}
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sort dist/*.sha256 > dist/checksums.txt
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.zip dist/checksums.txt --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/checksums.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --notes "Automated release for ${GITHUB_REF_NAME}."
          fi
